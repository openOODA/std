name: std CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run std self-tests
        run: |
          echo "std self-test runners: qa/probe_*.oo"
          echo "(stub: real CI requires ooda toolchain; see openOODA/ooda repo)"
      - name: Verify VERSION + api_surface
        run: |
          echo "Declared api_surface: $(grep api_surface VERSION | cut -d= -f2)"
          echo "Actual domain count:  $(ls -d */ | grep -E '^(core|fs|net|sec|science|app|hw|meta)/$' | wc -l)"
          test "$(grep api_surface VERSION | cut -d= -f2)" = "8" || (echo "api_surface drift"; exit 1)
          test "$(ls -d */ | grep -E '^(core|fs|net|sec|science|app|hw|meta)/$' | wc -l)" = "8" || (echo "expected 8 domains"; exit 1)
