name: std CI

on:
  push:
    branches: [master]

jobs:
  # Immune system: every qa probe builds and runs twice in fresh processes
  # with byte-identical output. AI writes the code; this makes it trustworthy.
  immune-system:
    runs-on: ubuntu-latest
    steps:
      - name: checkout std
        uses: actions/checkout@v4
        with:
          path: std
      - name: checkout oodac
        uses: actions/checkout@v4
        with:
          repository: openOODA/oodac
          path: oodac
      - name: checkout oodar
        uses: actions/checkout@v4
        with:
          repository: openOODA/oodar
          path: oodar
      - name: require compiler and clang
        run: |
          test -x oodac/bin/oodac || chmod +x oodac/bin/oodac
          if ! command -v clang >/dev/null; then sudo apt-get update && sudo apt-get install -y clang; fi
          command -v clang >/dev/null || { echo "clang required for oodac build (LLVM IR + oodar)"; exit 1; }
      - name: build oodar libs
        run: make -C oodar/scripts -f Makefile modular
      - name: double-run identical-twice suite
        working-directory: ${{ github.workspace }}/std
        env:
          OODA_COMPILER: ${{ github.workspace }}/oodac/bin/oodac
          OODA_FS_READDIR: ${{ github.workspace }}
          OODA_FS_WRITEDIR: ${{ github.workspace }}
          OO_LIST_AMBIENT_QUOTA: "1073741824"
        run: |
          set -euo pipefail
          # Product oodac build is LLVM IR + clang + oodar (not --backend c).
          "${OODA_COMPILER}" build qa/suite.oo -o /tmp/std_suite
          /tmp/std_suite
  # Locks in the check-clean relativistic dir (facade + 179 modules):
  # every file must pass `oodac check`. Run-all, report-all.
  relativistic-check:
    runs-on: ubuntu-latest
    steps:
      - name: checkout std
        uses: actions/checkout@v4
        with:
          path: std
      - name: checkout oodac
        uses: actions/checkout@v4
        with:
          repository: openOODA/oodac
          path: oodac
      - name: require compiler
        run: test -x oodac/bin/oodac || chmod +x oodac/bin/oodac
      - name: check every relativistic module
        working-directory: ${{ github.workspace }}/std
        env:
          OODA_FS_READDIR: ${{ github.workspace }}
          OODA_FS_WRITEDIR: ${{ github.workspace }}
        run: |
          set -uo pipefail
          OODAC="${{ github.workspace }}/oodac/bin/oodac"
          pass=0; fail=0
          while IFS= read -r f; do
            if "$OODAC" check "$f" >"/tmp/$(basename "$f").log" 2>&1; then
              pass=$((pass + 1))
            else
              fail=$((fail + 1))
              echo "FAIL $f :: $(head -1 "/tmp/$(basename "$f").log")"
            fi
          done < <(git ls-files "science/phys/relativistic/*.oo")
          echo "relativistic check: pass=$pass fail=$fail"
          test "$fail" -eq 0 || exit 1
  # Tree census: counts `oodac check` failures across ALL std modules.
  # Pre-existing debt outside the gated surface (relativistic dir + suite
  # are gated above and must be fully clean). This job ratchets: it fails
  # only if the count GROWS past the baseline. Lower the baseline in a
  # follow-up commit when cleanup drops the count. Informational: not in
  # auto-release needs (a red census blocks nothing, but stays visible).
  # Baseline 1404 measured 2026-09-29 with the resolution-based seed
  # (120s per-file timeout; timeouts count as failures).
  tree-census:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - name: checkout std
        uses: actions/checkout@v4
        with:
          path: std
      - name: checkout oodac
        uses: actions/checkout@v4
        with:
          repository: openOODA/oodac
          path: oodac
      - name: require compiler
        run: test -x oodac/bin/oodac || chmod +x oodac/bin/oodac
      - name: count tree-wide check failures
        working-directory: ${{ github.workspace }}/std
        env:
          OODA_FS_READDIR: ${{ github.workspace }}
          OODA_FS_WRITEDIR: ${{ github.workspace }}
        run: |
          set -uo pipefail
          OODAC="${{ github.workspace }}/oodac/bin/oodac"
          pass=0; fail=0
          while IFS= read -r f; do
            if timeout 120 "$OODAC" check "$f" >"/tmp/$(basename "$f").log" 2>&1; then
              pass=$((pass + 1))
            else
              fail=$((fail + 1))
            fi
          done < <(git ls-files "*.oo")
          echo "tree census: pass=$pass fail=$fail baseline=1404"
          test "$fail" -le 1404 || { echo "FAIL: tree rot grew past baseline ($fail > 1404)"; exit 1; }
  auto-release:
    needs: [immune-system, relativistic-check]
    uses: openOODA/openOODA/.github/workflows/auto-release.yml@v2.10.23
